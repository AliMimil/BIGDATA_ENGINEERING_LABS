version: '3.8'

services:
  hadoop-master:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-master
    hostname: hadoop-master
    ports:
      - "9870:9870"   # Hadoop NameNode Web UI
      - "8088:8088"   # YARN ResourceManager Web UI
      - "7077:7077"   # Spark Master
      - "19888:19888" # JobHistoryServer
      - "8080:8080"   # Jupyter
      - "9000:9000"   # HDFS NameNode
    networks:
      - hadoop
    volumes:
      - C:\Users\ali\Downloads\hadoop_project\:/shared_volume
    tty: true
    stdin_open: true

  hadoop-slave1:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-slave1
    hostname: hadoop-slave1
    ports:
      - "8040:8042"   # NodeManager 1
    networks:
      - hadoop
    tty: true
    stdin_open: true

  hadoop-slave2:
    image: yassern1/hadoop-spark-jupyter:1.0.3
    container_name: hadoop-slave2
    hostname: hadoop-slave2
    ports:
      - "8041:8042"   # NodeManager 2
    networks:
      - hadoop
    tty: true
    stdin_open: true

networks:
  hadoop:
    driver: bridge
